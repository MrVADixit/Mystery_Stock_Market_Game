# One-click deployment to Render, including a PostgreSQL database.
#
# In Render: New → Blueprint → connect this repository. Render reads this
# file, creates the database and the web service, wires DATABASE_URL between
# them and generates AUTH_SECRET. You are asked for two values: the email and
# password of the administrator account the first start will create.

databases:
  - name: mystery-stock-market-db
    databaseName: msm
    user: msm
    plan: free

services:
  - type: web
    name: mystery-stock-market
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required: NODE_ENV=production below also applies to
    # the build, and without it npm skips devDependencies, so typescript and
    # tailwind are missing and every "@/..." import fails to resolve.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are idempotent and record what they have applied, so running
    # them on every start is safe and keeps the schema in step with the code.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mystery-stock-market-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # You are prompted for these two when the blueprint is created. They
      # become your administrator sign-in at /admin.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "22"
      # Runtime only in effect: it is what marks the session cookies Secure.
      # See the build command above for why the install must opt back in.
      - key: NODE_ENV
        value: production
      # OPTIONAL extras, added afterwards in the Environment tab rather than
      # prompted for here, so a plain deployment asks nothing unnecessary:
      #   ANTHROPIC_API_KEY      the administrator's AI assistant
      #   APP_URL                e.g. https://your-app.onrender.com
      #   GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET
      #                          "Continue with Google / GitHub" for admins
      #   ADMIN_ALLOWED_EMAILS   who may become an admin via a provider
